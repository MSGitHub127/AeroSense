name: "AeroSense CI Pipeline"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: "Lint, Typecheck & Test Suite"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"

      - name: "Set up Python 3.12"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: "Run Ruff Linter & Formatter Check"
        run: "ruff check ."

      - name: "Execute Pytest Suite with Coverage"
        run: "pytest -v --cov=app --cov-report=term-missing"
        env:
          AEROSENSE_LLM_PROVIDER: "mock"
          AEROSENSE_FERNET_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
